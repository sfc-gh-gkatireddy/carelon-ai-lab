name: MEMBER_INTELLIGENCE
description: >
  Member 360 semantic model for the Carelon AI Lab. Covers members, medical
  claims, pharmacy claims, and providers for a synthetic commercial health
  plan population. Use this model for structured questions about cost of
  care, utilization, care gaps, and medication adherence.

tables:
  - name: MEMBERS
    description: Health plan enrollees with demographics, plan, and chronic condition flags.
    base_table:
      database: CARELON_LAB_DB
      schema: PAYER
      table: MEMBERS
    dimensions:
      - name: member_id
        expr: member_id
        data_type: VARCHAR
        description: Unique member identifier
        unique: true
      - name: member_name
        expr: name
        data_type: VARCHAR
        description: Member full name
      - name: gender
        expr: gender
        data_type: VARCHAR
        description: Member gender (M, F, X)
      - name: plan_id
        expr: plan_id
        data_type: VARCHAR
        description: Plan identifier
      - name: plan_name
        expr: plan_name
        data_type: VARCHAR
        description: Plan name, e.g. Blue Advantage PPO
      - name: plan_type
        expr: plan_type
        data_type: VARCHAR
        description: Plan product type (HMO, PPO, EPO, HDHP, Medicare Advantage)
        synonyms:
          - product
          - plan product
      - name: pcp
        expr: pcp
        data_type: VARCHAR
        description: Primary care provider identifier
      - name: chronic_condition
        expr: chronic_condition
        data_type: VARCHAR
        description: >
          Primary chronic condition flag (Diabetes, Hypertension, COPD,
          Asthma, Coronary Artery Disease, Heart Failure, Chronic Kidney
          Disease, Depression, Hyperlipidemia, or None)
        synonyms:
          - condition
          - diagnosis flag
          - disease
      - name: smoker_ind
        expr: smoker_ind
        data_type: VARCHAR
        description: Smoker indicator (Y or N)
      - name: state
        expr: state
        data_type: VARCHAR
        description: Member state of residence
      - name: city
        expr: city
        data_type: VARCHAR
        description: Member city of residence
    time_dimensions:
      - name: dob
        expr: dob
        data_type: DATE
        description: Member date of birth
      - name: enrollment_start
        expr: enrollment_start
        data_type: DATE
        description: Plan enrollment start date
      - name: enrollment_end
        expr: enrollment_end
        data_type: DATE
        description: Plan enrollment end date (null if currently enrolled)
    metrics:
      - name: member_count
        expr: COUNT(DISTINCT member_id)
        description: Number of unique members

  - name: MEDICAL_CLAIMS
    description: Medical claim lines with diagnosis, procedure, and amounts.
    base_table:
      database: CARELON_LAB_DB
      schema: PAYER
      table: MEDICAL_CLAIMS
    dimensions:
      - name: claim_id
        expr: claim_id
        data_type: VARCHAR
        description: Unique claim identifier
        unique: true
      - name: member_id
        expr: member_id
        data_type: VARCHAR
        description: Member identifier (join to MEMBERS)
      - name: provider_id
        expr: provider_id
        data_type: VARCHAR
        description: Provider identifier (join to PROVIDERS)
      - name: icd10_code
        expr: icd10_code
        data_type: VARCHAR
        description: ICD-10 diagnosis code
        synonyms:
          - diagnosis code
          - dx code
      - name: icd10_desc
        expr: icd10_desc
        data_type: VARCHAR
        description: Diagnosis description
      - name: procedure_code
        expr: procedure_code
        data_type: VARCHAR
        description: CPT procedure code
      - name: procedure_desc
        expr: procedure_desc
        data_type: VARCHAR
        description: Procedure description
      - name: claim_status
        expr: claim_status
        data_type: VARCHAR
        description: Claim status (Paid, Denied, Pending, Adjusted, Appealed)
      - name: service_type
        expr: service_type
        data_type: VARCHAR
        description: >
          Service category (Preventive Care, Office Visit, Emergency Room,
          Surgical, Diagnostic Imaging, Lab, Mental Health, Physical Therapy)
        synonyms:
          - service category
          - place of service
    time_dimensions:
      - name: service_date
        expr: service_date
        data_type: DATE
        description: Date of service
    facts:
      - name: billed_amt
        expr: billed_amt
        data_type: NUMBER
        description: Billed amount in USD
      - name: allowed_amt
        expr: allowed_amt
        data_type: NUMBER
        description: Allowed (negotiated) amount in USD
      - name: paid_amt
        expr: paid_amt
        data_type: NUMBER
        description: Paid amount in USD
        synonyms:
          - total medical spend
          - cost of care
          - total paid
    metrics:
      - name: total_paid_amount
        expr: SUM(paid_amt)
        description: Total paid amount in USD
        synonyms:
          - total medical spend
          - cost of care
      - name: total_billed_amount
        expr: SUM(billed_amt)
        description: Total billed amount in USD
      - name: claim_count
        expr: COUNT(*)
        description: Number of claim lines
      - name: denied_claim_count
        expr: COUNT_IF(claim_status = 'Denied')
        description: Number of denied claim lines

  - name: PHARMACY_CLAIMS
    description: Prescription fills with drug, class, and paid amounts.
    base_table:
      database: CARELON_LAB_DB
      schema: PAYER
      table: PHARMACY_CLAIMS
    dimensions:
      - name: rx_id
        expr: rx_id
        data_type: VARCHAR
        description: Unique prescription fill identifier
        unique: true
      - name: member_id
        expr: member_id
        data_type: VARCHAR
        description: Member identifier (join to MEMBERS)
      - name: drug_name
        expr: drug_name
        data_type: VARCHAR
        description: Drug name, e.g. Semaglutide
        synonyms:
          - medication
          - drug
      - name: ndc_code
        expr: ndc_code
        data_type: VARCHAR
        description: National Drug Code
      - name: drug_class
        expr: drug_class
        data_type: VARCHAR
        description: Therapeutic class (GLP-1 Agonist, Statin, Insulin, etc.)
        synonyms:
          - therapeutic class
          - class
      - name: drug_strength
        expr: drug_strength
        data_type: VARCHAR
        description: Drug strength
      - name: prescriber_id
        expr: prescriber_id
        data_type: VARCHAR
        description: Prescriber provider identifier
    time_dimensions:
      - name: fill_date
        expr: fill_date
        data_type: DATE
        description: Fill date
    facts:
      - name: days_supply
        expr: days_supply
        data_type: NUMBER
        description: Days supply per fill
        synonyms:
          - adherence denominator
      - name: paid_amt
        expr: paid_amt
        data_type: NUMBER
        description: Paid amount in USD
        synonyms:
          - pharmacy spend
          - drug spend
    metrics:
      - name: total_pharmacy_paid
        expr: SUM(paid_amt)
        description: Total pharmacy paid amount in USD
        synonyms:
          - pharmacy spend
          - drug spend
      - name: fill_count
        expr: COUNT(*)
        description: Number of fills
      - name: total_days_supply
        expr: SUM(days_supply)
        description: Total days supply dispensed

  - name: PROVIDERS
    description: Providers with specialty, network status, and cost per visit.
    base_table:
      database: CARELON_LAB_DB
      schema: PAYER
      table: PROVIDERS
    dimensions:
      - name: provider_id
        expr: provider_id
        data_type: VARCHAR
        description: Unique provider identifier
        unique: true
      - name: provider_name
        expr: name
        data_type: VARCHAR
        description: Provider name
      - name: specialty
        expr: specialty
        data_type: VARCHAR
        description: Provider specialty
      - name: npi
        expr: npi
        data_type: VARCHAR
        description: National Provider Identifier
      - name: network_status
        expr: network_status
        data_type: VARCHAR
        description: Network status (In-Network or Out-of-Network)
      - name: location
        expr: location
        data_type: VARCHAR
        description: City and state
    facts:
      - name: avg_cost_per_visit
        expr: avg_cost_per_visit
        data_type: NUMBER
        description: Average cost per visit in USD
    metrics:
      - name: provider_count
        expr: COUNT(DISTINCT provider_id)
        description: Number of unique providers
      - name: average_cost_per_visit
        expr: AVG(avg_cost_per_visit)
        description: Average cost per visit in USD

relationships:
  - name: medical_claims_to_members
    left_table: MEDICAL_CLAIMS
    right_table: MEMBERS
    relationship_columns:
      - left_column: member_id
        right_column: member_id
  - name: pharmacy_claims_to_members
    left_table: PHARMACY_CLAIMS
    right_table: MEMBERS
    relationship_columns:
      - left_column: member_id
        right_column: member_id
  - name: medical_claims_to_providers
    left_table: MEDICAL_CLAIMS
    right_table: PROVIDERS
    relationship_columns:
      - left_column: provider_id
        right_column: provider_id

verified_queries:
  - name: top_conditions_by_cost
    question: "What are the top 5 chronic conditions by total paid amount?"
    sql: |
      SELECT __MEMBERS.chronic_condition, SUM(__MEDICAL_CLAIMS.paid_amt) AS total_paid
      FROM __MEDICAL_CLAIMS
      JOIN __MEMBERS ON __MEDICAL_CLAIMS.member_id = __MEMBERS.member_id
      GROUP BY 1 ORDER BY 2 DESC LIMIT 5
  - name: monthly_pharmacy_by_class
    question: "Show me monthly pharmacy spend by drug class over the last year"
    sql: |
      SELECT DATE_TRUNC('month', __PHARMACY_CLAIMS.fill_date) AS fill_month,
             __PHARMACY_CLAIMS.drug_class,
             SUM(__PHARMACY_CLAIMS.paid_amt) AS total_paid
      FROM __PHARMACY_CLAIMS
      WHERE __PHARMACY_CLAIMS.fill_date >= DATEADD('year', -1, CURRENT_DATE)
      GROUP BY 1, 2 ORDER BY 1, 3 DESC
  - name: denied_claims_by_service
    question: "Which service types have the most denied claims?"
    sql: |
      SELECT __MEDICAL_CLAIMS.service_type,
             COUNT_IF(__MEDICAL_CLAIMS.claim_status = 'Denied') AS denied_claims
      FROM __MEDICAL_CLAIMS
      GROUP BY 1 ORDER BY 2 DESC
